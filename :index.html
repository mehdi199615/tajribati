<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربتي - محرك بحث تجارب البشر</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121214;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            padding: 20px;
            width: 90%;
            max-width: 500px;
        }
        h1 {
            font-size: 2.5rem;
            color: #00ff88;
            margin-bottom: 10px;
        }
        p {
            color: #aaa;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        .search-box {
            position: relative;
            width: 100%;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: 2px solid #333;
            border-radius: 30px;
            background-color: #1a1a1e;
            color: #fff;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
            text-align: center;
        }
        input[type="text"]:focus {
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.2);
        }
        .btn {
            margin-top: 20px;
            background-color: #00ff88;
            color: #121214;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #00cc6e;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>تجربتي</h1>
        <p>ابحث عن تجارب ومشاعر بشرية حقيقية.. بدون خوارزميات أو إعلانات.</p>
        
        <div class="search-box">
            <input type="text" placeholder="بماذا تشعر الآن؟ أو ما هي التجربة التي تبحث عنها؟">
        </div>
        
        <button class="btn" onclick="alert('قريباً سنربط محرك البحث بقاعدة البيانات الحية!')">ابحث عن تجربة</button>
    </div>

</body>
</html>
